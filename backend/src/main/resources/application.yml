server:
  port: 8090

spring:
  application:
    name: agreement
  datasource:
    url: jdbc:mysql://localhost:3306/agreement_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: REDACTED_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

logging:
  level:
    com.example.agreement: INFO
    com.itextpdf: WARN
