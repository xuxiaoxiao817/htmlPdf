server:
  port: 8090

spring:
  application:
    name: agreement
  datasource:
    url: jdbc:mysql://localhost:3306/agreement_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # Password is read from the DB_PASSWORD environment variable. Set it before
    # running the app, e.g. `DB_PASSWORD=xxx mvn spring-boot:run` on bash, or
    # `$env:DB_PASSWORD="xxx"; mvn spring-boot:run` on PowerShell. The default
    # below is intentionally non-secret so the app fails loudly at startup if
    # the env var is missing — better than silently picking up an old password.
    password: ${DB_PASSWORD:SET_DB_PASSWORD_ENV_VAR}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

logging:
  level:
    com.example.agreement: INFO
    com.itextpdf: WARN
